version: 2.1

orbs:
  github-maven-deploy: github-maven-deploy/github-maven-deploy@1.3.2

executors:
  java8-executor:
    docker:
      - image: cimg/openjdk:8.0
  java21-executor:
    docker:
      - image: cimg/openjdk:21.0

mvn-build-test-command: &mvn-build-test-command
  mvn-build-test-command: mvn verify -Dmaven.javadoc.skip=true -Djacoco.skip=true -Dlicense.skip=true

mvn-deploy-command: &mvn-deploy-command
  mvn-deploy-command:  |
    mvn -s .circleci/maven-central-settings.xml clean deploy -DdeployAtEnd=true -DperformRelease=true -DskipTests -Dspotbugs.skip=true -Denforcer.skip=true -Djacoco.skip=true -Dossindex.skip=true
    mvn com.mycila:license-maven-plugin:3.0:remove
  context: RELEASE_PROFILE_BBOTTEMA

jobs:
  java8-core-and-provider:
    executor: java8-executor
    steps:
      - checkout
      - restore_cache:
          key: maven-github-release-{{ checksum ".circleci/config.yml" }}
      - run:
          name: Build and test core plus Jakarta provider on Java 8
          command: mvn -pl smtp-connection-pool-jakarta-provider -am clean test -Djacoco.skip=true -Dlicense.skip=true

workflows:
  workflow:
    jobs:
      - github-maven-deploy/build-and-test:
          executor: java21-executor
          <<: *mvn-build-test-command
          filters:
            branches:
              only: master

      - java8-core-and-provider:
          filters:
            branches:
              only: master

      - github-maven-deploy/approve-deploy-patch-version:
          type: approval
          requires:
            - github-maven-deploy/build-and-test
            - java8-core-and-provider
      - github-maven-deploy/approve-deploy-minor-version:
          type: approval
          requires:
            - github-maven-deploy/build-and-test
            - java8-core-and-provider
      - github-maven-deploy/approve-deploy-major-version:
          type: approval
          requires:
            - github-maven-deploy/build-and-test
            - java8-core-and-provider
      - github-maven-deploy/approve-deploy-as-is-version:
          type: approval
          requires:
            - github-maven-deploy/build-and-test
            - java8-core-and-provider

      - github-maven-deploy/deploy-patch-version:
          executor: java21-executor
          requires:
            - github-maven-deploy/approve-deploy-patch-version
          <<: *mvn-deploy-command
      - github-maven-deploy/deploy-minor-version:
          executor: java21-executor
          requires:
            - github-maven-deploy/approve-deploy-minor-version
          <<: *mvn-deploy-command
      - github-maven-deploy/deploy-major-version:
          executor: java21-executor
          requires:
            - github-maven-deploy/approve-deploy-major-version
          <<: *mvn-deploy-command
      - github-maven-deploy/deploy-as-is-version:
          executor: java21-executor
          requires:
            - github-maven-deploy/approve-deploy-as-is-version
          <<: *mvn-deploy-command
